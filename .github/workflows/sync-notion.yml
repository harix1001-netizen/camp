name: Notionからデータ同期

on:
  workflow_dispatch:
  schedule:
    # 毎週金曜 18:00 JST（週末の計画前に更新）
    - cron: '0 9 * * 5'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Notion トークンの確認
        id: check
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "NOTION_TOKEN が未設定のためスキップします"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 同期
        if: steps.check.outputs.skip != 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/sync-notion.mjs
      - name: 変更があればコミット
        if: steps.check.outputs.skip != 'true'
        run: |
          # 日付だけの変更ではコミットしない
          if git diff --quiet -I '"updatedAt"' -- data/; then
            echo "データに変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Notionからキャンプデータを同期"
          git push
